name: Desplegar en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: |
          npm install --no-save terser clean-css-cli html-minifier-terser

      - name: Minificar y añadir cabecera
        run: |
          set -e

          HEADER_CODE="© Geopadel · Todos los derechos reservados. Queda prohibida la reproducción total o parcial sin autorización."
          HEADER_JS="/* $HEADER_CODE */"
          HEADER_HTML="<!-- $HEADER_CODE -->"

          echo "→ Minificando JS (excluyendo sw.js, workers y assets)..."
          find . -type f -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            -not -path "./assets/*" \
            -not -name "sw.js" \
            -not -name "bump-sw.js" \
            -not -name "copia-worker.js" \
            -not -name "copia-zip.js" \
            | while read -r f; do
              npx terser "$f" -o "$f" -c -m --comments false --preamble "$HEADER_JS"
              node -c "$f" || { echo "❌ Error de sintaxis en $f"; exit 1; }
            done

          echo "→ Minificando CSS (excluyendo assets)..."
          find . -type f -name "*.css" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            -not -path "./assets/*" \
            | while read -r f; do
              npx cleancss -o "$f" "$f"
              printf "%s\n%s" "$HEADER_JS" "$(cat "$f")" > "$f.tmp" && mv "$f.tmp" "$f"
            done

          echo "→ Minificando HTML (sin tocar JS/CSS inline)..."
          find . -type f -name "*.html" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" \
            | while read -r f; do
              npx html-minifier-terser "$f" -o "$f" \
                --collapse-whitespace \
                --remove-comments \
                --remove-attribute-quotes \
                --use-short-doctype \
                --minify-js false \
                --minify-css false
              printf "%s\n%s" "$HEADER_HTML" "$(cat "$f")" > "$f.tmp" && mv "$f.tmp" "$f"
            done

      - name: Regenerar VERSION del service worker
        run: node bump-sw.js

      - name: Limpiar archivos innecesarios
        run: |
          rm -rf .git .github node_modules package-lock.json bump-sw.js scripts wrangler.toml package.json
          echo "Archivos a subir:"
          ls -la

      - name: Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=geopadelclub
