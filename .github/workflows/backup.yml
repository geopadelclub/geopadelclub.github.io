name: Backup diario a Google Drive

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar PostgreSQL y rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          # Compacta el JSON a una sola línea (elimina \n y \r)
          TOKEN_ONE_LINE=$(echo "$GDRIVE_TOKEN" | tr -d '\n\r' | jq -c .)
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive
          token = $TOKEN_ONE_LINE
          EOF
          chmod 600 ~/.config/rclone/rclone.conf
          echo "→ Probando conexión con Google Drive..."
          rclone lsd gdrive: --max-depth 1

      - name: Generar y cifrar backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FECHA=$(date +%F)
          ARCHIVO="geopadel_${FECHA}.sql.gz.enc"

          pg_dump --no-owner --no-privileges --clean --if-exists "$DATABASE_URL" \
            | gzip \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -out "$ARCHIVO"

          echo "Backup generado: $ARCHIVO ($(du -h $ARCHIVO | cut -f1))"

      - name: Subir a Google Drive
        run: |
          FECHA=$(date +%F)
          rclone copy "geopadel_${FECHA}.sql.gz.enc" "gdrive:/"

      - name: Borrar backups viejos (más de 30 días)
        run: |
          rclone delete "gdrive:/" --min-age 30d --include "geopadel_*.sql.gz.enc"
