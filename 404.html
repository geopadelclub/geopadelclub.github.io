<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Geopadel</title>
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/webp" href="./Geopadel.webp">
    <script> (function () { try { var t = localStorage.getItem('gp-theme'); if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); } catch (e) { } })(); </script>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            text-align: center;
            background: var(--bg);
            color: var(--text);
        }

        .error-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 28px;
            max-width: 460px;
            width: 100%;
            box-shadow: var(--shadow-md);
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--primary);
            margin: 16px 0 8px;
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--heading);
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 1rem;
            color: var(--muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            background-color: var(--primary);
            color: var(--on-primary);
            text-decoration: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 14px;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-action.secondary {
            background-color: var(--surface-3);
            color: var(--heading);
            border: 1px solid var(--border-strong);
        }

        .btn-action:hover {
            filter: brightness(0.95);
        }

        .btn-action:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <main class="error-card">
        <img src="./Geopadel.webp" alt="Geopadel Logo" width="120" height="120">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Página no encontrada</h2>
        <p class="error-message">La dirección que buscas no existe o ha sido movida.</p>
        <div class="btn-group">
            <a href="panel.html" class="btn-action">Volver al Panel</a>
            <a href="reservar.html" class="btn-action secondary">Reservar Pista</a>
        </div>
    </main>
</body>

</html>
