<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="Tienda oficial del club de pádel Geopadel en Ogíjares (Granada)."
    />
    <title>Tienda · Geopadel</title>
    <meta name="theme-color" content="#fcfdfc" id="metaTheme" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest-reservar.webmanifest" />
    <link rel="icon" type="image/webp" sizes="192x192" href="./geopadel.webp" />
    <link rel="apple-touch-icon" href="./geopadel.webp" />
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="assets/remixicon/remixicon.css" />
    <link rel="stylesheet" href="reservar-styles.css" />
    <script defer src="tienda-bundle.js"></script>

  <body>
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    <div id="toasts" role="status" aria-live="polite"></div>
    <header class="app-header">
      <a href="/" class="gp-brand gp-brand-link" aria-label="Volver al inicio"
        ><img
          class="gp-logo"
          src="./geopadel.webp"
          alt="Geopadel"
          draggable="false"
          width="150"
          height="150"
      /></a>
      <div class="user-info">
        <button
          type="button"
          class="theme-toggle btn-idioma"
          id="btnIdioma"
          data-action="cambiar-idioma"
          aria-label="Cambiar idioma"
        >
          ES</button
        ><button
          type="button"
          class="theme-toggle"
          id="btnTema"
          aria-label="Cambiar tema"
        >
          <i class="ri-moon-line" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <main class="cl-main cl-main-tienda" id="main-content">
      <div class="cl-intro">
        <h1 data-i18n="tienda.titulo">Tienda</h1>
        <p data-i18n="tienda.subtitulo">
          Esto es lo que tenemos en el club. Se compra en el club.
        </p>
      </div>
      <div id="tiendaGrid" class="tienda-grid" aria-live="polite"></div>
      <p class="cl-legal cl-hint cl-legal-tienda">
        <a href="privacidad" data-i18n="footer.privacidad">Privacidad</a> ·
        <a href="aviso-legal" data-i18n="footer.aviso">Aviso Legal</a> ·
        <a href="politica-cookies" data-i18n="footer.cookies">Cookies</a>
      </p>
    </main>
  </body>
</html>
